# CodeRabbit Configuration File
# Repository: Mohamed-529/TrustChain (MilestoneProof AI)
# Role: Independent AI Code Reviewer & Security Gatekeeper (NOT an automatic merger)

language: "en-US"

reviews:
  profile: "assertive" # Rigorous, high-standard review suitable for financial software
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  # Auto-review pull requests targeting main
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"

  # Exclude build output, vendor libraries, and database files
  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/*.sqlite*"
    - "!**/*.db*"
    - "!**/*.lock"
    - "!**/coverage/**"
    - "!**/.temp*/**"

  # Domain-specific path instructions for TrustChain
  path_instructions:
    - path: "src/server/services/SettlementPolicyService.ts"
      instructions: |
        CRITICAL FINANCIAL INTEGRITY REVIEW:
        - Verify all monetary calculations use integer cents. Floating-point currency math is strictly forbidden.
        - Ensure AI agent outputs cannot override mathematical formula outcomes.
        - Verify late penalties and quality deductions cannot produce negative permitted amounts.

    - path: "src/server/services/PayPalService.ts"
      instructions: |
        FINANCIAL SAFETY & IDEMPOTENCY REVIEW:
        - Verify capture operations require explicit prior human approval. AI must never auto-capture.
        - Verify genuine PayPal authorization IDs are extracted from `purchase_units[0].payments.authorizations[0].id`.
        - Ensure `PayPal-Request-Id` and persistent idempotency keys prevent duplicate captures.
        - Verify webhook signatures are validated via official fail-closed endpoints (`POST /v1/notifications/verify-webhook-signature`).

    - path: "src/server/services/GitHubVerificationService.ts"
      instructions: |
        PROVENANCE & TAMPER DETECTION REVIEW:
        - Verify evidence SHA-256 canonical hashing detects post-submission database modifications.
        - Ensure GitHub REST API verification handles rate limits (HTTP 429), timeouts, and 404s safely.
        - Confirm `X-Hub-Signature-256` webhook verification uses constant-time comparison (`crypto.timingSafeEqual`).

    - path: "src/server/repositories/**"
      instructions: |
        ACID PERSISTENCE & AUDIT REVIEW:
        - Verify SQLite transactions use WAL mode with `synchronous=FULL`.
        - Ensure state mutations roll back atomically on failure.
        - Verify append-only hash-chained audit trails (`previous_hash` linking to genesis) remain intact.

    - path: "src/server/middleware/**"
      instructions: |
        SECURITY & RBAC REVIEW:
        - Verify HMAC-SHA256 session token verification rejects expired tokens, invalid signatures, and role spoofing.
        - Verify request payloads are validated against OpenAPI 3.0.3 schemas.
        - Ensure path traversal is blocked on static file endpoints.

    - path: "src/components/**"
      instructions: |
        FRONTEND RESILIENCE REVIEW:
        - Verify Bryntum Gantt integration respects read-only fiduciary locks (`readOnly={true}`).
        - Ensure UI handles loading, error/retry, and empty schedule states gracefully.
        - Confirm no credentials or private API keys are exposed to the client bundle.

# Chat and collaboration
chat:
  auto_reply: true
